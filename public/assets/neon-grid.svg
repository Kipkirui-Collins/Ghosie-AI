<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#00121a" />
      <stop offset="100%" stop-color="#0b0f1a" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)" />
  <g stroke="#0ff" stroke-opacity="0.06" stroke-width="1">
    <!-- grid lines -->
    <!-- vertical -->
    ${Array.from({ length: 40 }).map((_, i) => `<line x1="${(i+1)*30}" y1="0" x2="${(i+1)*30}" y2="800"/>`).join('')}
    <!-- horizontal -->
    ${Array.from({ length: 27 }).map((_, i) => `<line x1="0" y1="${(i+1)*30}" x2="1200" y2="${(i+1)*30}"/>`).join('')}
  </g>
</svg>
